<footer class="footer th-surface-deep">
  <div class="th-container">
    <div class="footer__grid">
      <div>
        <app-brand-mark [name]="footer.brand" />
        <p class="footer__tagline">{{ footer.tagline }}</p>
      </div>

      <nav aria-label="Footer">
        <h2 class="footer__title">Navigate</h2>
        <ul class="footer__list">
          @for (link of footer.links; track link.href) {
            <li><a [href]="link.href">{{ link.label }}</a></li>
          }
        </ul>
      </nav>

      <div>
        <h2 class="footer__title">Get in touch</h2>
        <a class="footer__email" [href]="footer.email.href">{{ footer.email.label }}</a>
      </div>
    </div>

    <div class="footer__bottom">
      <span>© {{ year }} {{ footer.brand }}</span>
    </div>
  </div>
</footer>
