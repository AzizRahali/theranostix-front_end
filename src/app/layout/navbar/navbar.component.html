<header class="nav">
  <div class="nav__bar">
    <a class="nav__brand" href="#top" [attr.aria-label]="nav.brand + ', back to top'" (click)="close()">
      <app-brand-mark [name]="nav.brand" />
    </a>

    <app-desktop-nav class="nav__desktop" [links]="nav.links" [cta]="nav.cta" />

    <button class="nav__toggle" type="button" [attr.aria-controls]="menuId"
            [attr.aria-expanded]="menuOpen()" (click)="toggle()">
      <span class="th-visually-hidden">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      <span class="nav__burger" [class.nav__burger--open]="menuOpen()" aria-hidden="true"></span>
    </button>
  </div>

  <app-mobile-menu [menuId]="menuId" [open]="menuOpen()" [links]="nav.links"
                   [cta]="nav.cta" [email]="nav.email" (navigate)="close()" />
</header>
