<!-- `th-play` is static: the hero's boot sequence runs on first paint, pure CSS. -->
<section id="top" class="hero th-surface-deep th-grid th-play">
  <div class="hero__media">
    <img class="hero__img" appPointerParallax [parallaxStrength]="18"
         ngSrc="assets/images/therion.webp" fill priority
         sizes="(min-width: 960px) 56vw, 100vw" [alt]="hero.imageAlt" />
    <app-hud-frame class="hero__hud" appPointerParallax [parallaxStrength]="-8"
                   [topLabel]="hero.hud.top" [bottomLabel]="hero.hud.bottom" />
  </div>
  <app-orbit class="hero__orbit" />

  <div class="th-container hero__inner">
    <div class="hero__copy">
      <app-eyebrow>{{ hero.eyebrow }}</app-eyebrow>
      <app-accent-heading [level]="1" [parts]="hero.heading" />
      <p class="hero__lede">{{ hero.lede }}</p>
      <app-circle-link [href]="hero.cta.href" [label]="hero.cta.label" />
    </div>
  </div>
</section>
