<section id="vision" class="th-section th-surface-deep th-grid">
  <app-orbit class="vision__orbit" appReveal="fade" />

  <div class="th-container th-split">
    <div appReveal>
      <app-eyebrow>{{ vision.eyebrow }}</app-eyebrow>
      <app-accent-heading [parts]="vision.heading" />
    </div>
    <div class="th-prose" appReveal [revealDelay]="200">
      @for (paragraph of vision.paragraphs; track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </div>
</section>
