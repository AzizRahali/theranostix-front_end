<div class="flow">
  <div class="flow__row">
    @for (node of nodes; track node.icon; let last = $last) {
      <div class="flow__node">
        <span class="flow__ico" aria-hidden="true">
          @switch (node.icon) {
            @case ('isotopes') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.4" />
                <circle cx="12" cy="12" r="2.4" fill="currentColor" />
              </svg>
            }
            @case ('hot-lab') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.4" />
                <path d="M8 12h8" stroke="currentColor" stroke-width="1.4" />
              </svg>
            }
            @case ('injector') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M12 4v9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <path d="M12 13l5-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <circle cx="12" cy="19" r="2.4" fill="currentColor" />
              </svg>
            }
            @case ('scanner') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.4" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.4" />
              </svg>
            }
          }
        </span>
        <span class="flow__label">{{ node.label }}</span>
      </div>

      @if (!last) {
        <div class="flow__connector flow__connector--h" aria-hidden="true"><span class="flow__line"></span></div>
        <div class="flow__connector flow__connector--v" aria-hidden="true"><span class="flow__line"></span></div>
      }
    }
  </div>
</div>
